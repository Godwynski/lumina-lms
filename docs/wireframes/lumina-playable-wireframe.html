    const byId = Object.fromEntries(SCREENS.map(s => [s.id, s]));
    let currentId = SCREENS[0].id;
    let historyStack = [];
    let mode = "wire";
    let showSpots = true;
    let zoom = 0.8;

    function buildSidebar() {
      const sb = document.getElementById("sidebar");
      const roles = [...new Set(SCREENS.map(s => s.role))];
      sb.innerHTML = roles.map(r => {
        const items = SCREENS.filter(s => s.role === r).map(s =>
          `<button class="scr-btn ${s.id === currentId ? 'active' : ''}" onclick="navigate('${s.id}')"><span>${s.title}</span><span style="opacity:.6;font-size:10px">${s.hotspots.length}</span></button>`
        ).join("");
        return `<div class="role-hdr">${r}</div>${items}`;
      }).join("");
    }

    function render() {
      const s = byId[currentId];
      document.getElementById("crumb").textContent = `${s.role} • ${s.route} (${s.vw}×${s.vh})`;
      const st = document.getElementById("stage");
      st.style.width = s.vw + "px";
      st.style.height = s.vh + "px";
      st.style.transform = `scale(${zoom})`;
      st.className = "stage" + (showSpots ? "" : " hide-spots");
      const src = mode === "wire" ? s.svgFile : s.shotFile;
      const spotsHtml = s.hotspots.map(h =>
        `<div class="hotspot" title="${h.label || h.href} → ${h.targetId}" style="left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px" onclick="navigate('${h.targetId}')"></div>`
      ).join("");
      st.innerHTML = `<img src="${src}" alt="${s.title}"/>${spotsHtml}`;
      buildSidebar();
    }

    function navigate(id, push = true) {
      if (!byId[id] || id === currentId) return;
      if (push) historyStack.push(currentId);
      currentId = id;
      render();
    }
    function goBack() {
      if (!historyStack.length) return;
      currentId = historyStack.pop();
      render();
    }
    function setMode(m) {
      mode = m;
      document.getElementById("modeWire").classList.toggle("active", m === "wire");
      document.getElementById("modeReal").classList.toggle("active", m === "real");
      render();
    }
    function toggleSpots() {
      showSpots = !showSpots;
      document.getElementById("spotToggle").classList.toggle("active", showSpots);
      render();
    }
    function setZoom(z) { zoom = parseFloat(z); render(); }
