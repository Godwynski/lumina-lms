    <text x="215" y="35" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">LUMINA</text>
    <text x="171" y="206" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="800" fill="#0f172a">STI College</text>
    <text x="171" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="800" fill="#0f172a">Alabang Library</text>
    <text x="171" y="314" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#0f172a">Search the library catalog, reserve a copy for pickup and keep track of</text>
    <text x="171" y="342" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#0f172a">what you have borrowed.</text>
    <text x="305" y="410" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Sign in with Microsoft</text>
    <text x="296" y="461" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Quick Demo Access</text>
    <text x="212" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Super Admin</text>
    <text x="410" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Librarian</text>
    <text x="212" y="563" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Student Assistant</text>
    <text x="410" y="563" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Student</text>
    <text x="171" y="616" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">How borrowing works</text>
    <text x="171" y="823" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">How borrowing works</text>
    <text x="171" y="971" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Step</text>
    <text x="206" y="971" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1</text>
    <text x="171" y="1001" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Find the title in the catalog</text>
    <text x="171" y="1034" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Search by title, author or ISBN. Each book shows how many</text>
    <text x="171" y="1058" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">copies are available and its shelf location.</text>
    <text x="171" y="1319" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Step</text>
    <text x="206" y="1319" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2</text>
    <text x="171" y="1349" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Reserve a copy for pickup</text>
    <text x="171" y="1382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">If a copy is in, Reserve for Pickup holds it for you until the</text>
    <text x="171" y="1406" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">pickup date shown. If every copy is out, reserving puts you in</text>
    <text x="171" y="1430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">the queue and shows your position.</text>
    <text x="171" y="1679" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Step</text>
    <text x="206" y="1679" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">3</text>
    <text x="171" y="1709" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Borrow and return at the circulation desk</text>
    <text x="171" y="1742" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Checkout is not done online. Show the library card from your</text>
    <text x="171" y="1766" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">dashboard at the desk and staff scan it to lend you the book.</text>
    <text x="171" y="1790" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Bring the book back to the desk to return it.</text>
    <text x="171" y="2068" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Before you sign in</text>
    <text x="171" y="2138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Which account do I use?</text>
    <text x="566" y="2138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Your STI College Alabang Microsoft account, the one ending</text>
    <text x="566" y="2162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">in @alabang.sti.edu.ph.</text>
    <text x="171" y="2227" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Can I reserve books right after my first sign-in?</text>
    <text x="566" y="2227" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Not yet. You complete your profile first, then show your school ID at the library</text>
    <text x="566" y="2251" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">circulation desk so the librarian can activate your account.</text>
    <text x="171" y="2316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Where do I check a reservation or a due date?</text>
    <text x="566" y="2316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">On your dashboard. Reservations shows Ready for Pickup or your queue</text>
    <text x="566" y="2340" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">position, and Current Borrows shows when each book is due. Past loans are</text>
    <text x="566" y="2364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">under Borrow History.</text>
  </g>
</svg>